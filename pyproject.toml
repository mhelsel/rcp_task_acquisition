[build-system]
requires = ["setuptools>=61.0",
		 "setuptools-scm>= 9.2.2, < 10"]
build-backend = "setuptools.build_meta"


[project]
name = "rcp-task-acquisition"
dynamic = ["version", "dependencies"]
readme = "README.md"
requires-python = ">=3.10, <3.11"

[project.optional-dependencies]

dev = [
	"pre-commit >= 4.6, < 5",
]


[project.scripts]
rcp-task-acquisition = "rcp_task_acquisition.__main__:run_app"
create-shortcut = "rcp_task_acquisition.utils.shortcut:create_shortcut"
deidentify-data = "rcp_task_acquisition.utils.deidentify_dates:run_all_dates"


[tool.setuptools_scm]


[tool.black]
line-length = 100
target-version = ['py310', 'py312']
# explicit excludes:
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''
